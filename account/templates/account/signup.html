{% extends "base.html" %} {% block head %}
<style>
    .form-container {
        width: 100%;
        max-width: 600px;
        margin: auto;
    }
    
    .alert {
        margin-top: 10px;
        margin-bottom: 20px;
        font-size: 0.9rem;
        padding: 12px 15px;
        border-radius: 6px;
        border: none;
    }
    
    .alert-danger {
        background-color: rgba(214, 116, 116, 0.15);
        color: #D67474;
        border-left: 3px solid #D67474;
    }
    /* Auth Card Styling */
    
    .auth-card {
        background-color: var(--card-bg);
        border: none;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        transition: all 0.3s ease;
        border: 1px solid var(--border-color);
        width: 100%;
        color: var(--text-color);
    }
    
    .auth-card:hover {
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
        transform: translateY(-3px);
    }
    
    .auth-title {
        color: var(--text-color);
        font-weight: 600;
        letter-spacing: 0.3px;
    }
    
    .form-label {
        color: var(--accent-light);
        font-weight: 500;
        font-size: 0.9rem;
        margin-bottom: 6px;
    }
    
    .form-control {
        background-color: var(--input-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-color);
        padding: 12px 15px;
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }
    
    .form-control:focus {
        background-color: rgba(75, 80, 115, 0.9);
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(107, 130, 168, 0.2);
    }
    
    .form-control::placeholder {
        color: rgba(185, 193, 210, 0.8);
        font-size: 0.9rem;
    }
    
    .signup-pattern {
        display: none;
        /* Hide the pattern completely */
    }
    
    .text-muted-custom {
        color: var(--text-color);
    }
    
    .link-custom {
        color: var(--accent-light);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
    }
    
    .link-custom:hover {
        color: #ffffff;
        text-decoration: underline;
    }
    
    .btn-theme {
        padding: 12px;
        font-weight: 500;
        letter-spacing: 0.3px;
    }
    
    .card-content {
        position: relative;
        z-index: 1;
    }
    /* Media Queries for Responsiveness */
    
    @media (min-width: 992px) {
        .form-container {
            max-width: 750px;
        }
    }
    
    @media (min-width: 1200px) {
        .form-container {
            max-width: 900px;
        }
    }
</style>
{% endblock %} {% block content %}
<div class="container mt-5">
    <!-- Alerts Section -->
    {% if messages %}
    <div id="alerts" class="mb-4">
        {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Signup Form -->
    <div class="form-container">
        <div class="auth-card card p-4 shadow-lg position-relative overflow-hidden">
            <div class="signup-pattern"></div>
            <div class="card-content">
                <h2 class="auth-title text-center mb-4">Create Your Account</h2>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirm-password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm-password" name="confirm_password" placeholder="Re-enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-theme w-100">Sign Up</button>
                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted-custom">Already have an account? <a href="{% url 'login' %}" class="link-custom">Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const alertDiv = document.getElementById("alerts");
        if (alertDiv) {
            setTimeout(() => {
                alertDiv.style.display = "none";
            }, 9000);
        }
    });
</script>
{% endblock %}
